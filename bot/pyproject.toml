[project]
name = "harbormaster-bot"
version = "0.1.0"
description = "Discord bot for managing self-hosted game servers via Harbormaster scripts."
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.4",
    "azure-identity>=1.17",
    "azure-mgmt-compute>=33",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harbormaster_bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
